<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF8100">
  <meta name="description" content="Praça do Caju. espere até 20/10...">
  <title>Praça do Caju — 20/10</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="navbar">
      <a class="brand" href="index.html" aria-label="Praça do Caju — início">
        <img src="assets/caju-mark.png" width="52" height="52" alt="">
        <span>Praça do Caju<span class="brand-period">.</span></span>
      </a>
      <span class="nav-date">20 OUT<span aria-hidden="true"> / </span>2026</span>
    </header>

    <main>
      <section class="teaser" aria-labelledby="reveal-date">
        <div class="edition" aria-hidden="true"><span>PRAÇA DO CAJU</span><span>01 — 2026</span></div>
        <div class="hero-copy">
          <span class="date-label">GUARDE ESSA DATA</span>
          <h1 id="reveal-date"><time datetime="2026-10-20">20<span class="slash">/</span>10</time></h1>
          <p class="teaser-line">espere até 20/10...</p>
        </div>

        <div class="art art-left" aria-hidden="true"><img src="assets/caju-mark.png" alt="" width="1024" height="1024"></div>
        <div class="art art-right" aria-hidden="true"><img src="assets/hero-caju.png" alt="" width="1024" height="1024"></div>

        <div class="countdown" role="group" aria-label="Contagem regressiva para 20 de outubro de 2026" hidden>
          <div class="time-unit"><span id="days">00</span><span class="unit-label">dias</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span id="hours">00</span><span class="unit-label">horas</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span id="minutes">00</span><span class="unit-label">min</span></div>
          <span class="time-separator" aria-hidden="true">:</span>
          <div class="time-unit"><span id="seconds">00</span><span class="unit-label">seg</span></div>
        </div>
        <div class="hero-bottom" aria-hidden="true"><span>20°10′</span><span class="three-dots">● ● ●</span><span>ATÉ LÁ.</span></div>
      </section>
    </main>

    <footer>
      <span>© 2026 Praça do Caju</span>
      <button id="motion-toggle" type="button" aria-pressed="false" hidden><span class="motion-icon" aria-hidden="true">Ⅱ</span><span class="motion-label">Pausar animações</span></button>
      <span class="footer-signature">feito de expectativa.</span>
    </footer>
  </div>
</body>
</html>
